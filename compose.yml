services:
  floci:
    image: floci/floci:1.5.33-compat
    ports:
      - "4566:4566"
    env_file:
      - "compose/aws.env"
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      # Hostname floci puts in returned QueueUrls, so they stay reachable from
      # the host. Floci starts every service, so there is no SERVICES list.
      FLOCI_HOSTNAME: 127.0.0.1
    volumes:
      # Mounted as individual files rather than as a directory, because several
      # repos add scripts to this container (see compose.config-broker.yml, and
      # grants-ui once it defines its own floci service). Compose merges volumes
      # by target path, so two repos each mounting a *directory* at the same
      # target would silently drop one set of scripts.
      #
      # Floci pools the scripts from every init directory and runs them ordered
      # by filename, so the numeric prefixes sequence the whole stack. Keeping
      # core's scripts in ready.d also leaves start.d free for repos that mount
      # a directory there. 99-ready.sh must sort last: it writes the marker the
      # healthcheck waits on, so nothing that depends on floci starts before its
      # queues and topics exist.
      - ./compose/floci/ready.d/10-core-resources.sh:/etc/floci/init/ready.d/10-core-resources.sh:ro
      - ./compose/floci/ready.d/99-ready.sh:/etc/floci/init/ready.d/99-ready.sh:ro
    healthcheck:
      test: ["CMD", "stat", "/tmp/READY"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    networks:
      - cdp-tenant
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      ["mongod", "--replSet", "mongoRepl", "--bind_ip", "0.0.0.0"]
    volumes:
      - mongodb-data:/data/db

  mongo-ready:
    image: mongo:7.0
    container_name: "mongo-ready"
    depends_on:
      mongodb:
        condition: service_started
    networks: [cdp-tenant]
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
      RS_HOST: "mongodb:27017"
    volumes:
      - ./compose/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'db.hello().isWritablePrimary' | grep -q true || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 60


  entra:
    container_name: entra
    image: defradigital/fg-entra-stub-frontend:0.18.0
    ports:
      - "3010:3010"
    networks:
      - cdp-tenant
    volumes:
      - ./compose/entra-clients.js:/home/node/src/server/common/clients.js:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3010/jwks"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - "6379:6379"
    networks:
      - cdp-tenant
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    name: cdp-tenant
    driver: bridge
