services:
  localstack:
    image: localstack/localstack:4.3.0
    ports:
      - "4566:4566"
    env_file:
      - "compose/aws.env"
    environment:
      DEBUG: 1
      LS_LOG: DEBUG
      SERVICES: sqs,sns
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - ./tmp/localstack:/var/lib/localstack"
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    networks:
      - cdp-tenant
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      ["mongod", "--replSet", "mongoRepl", "--bind_ip", "0.0.0.0"]
    volumes:
      - mongodb-data:/data/db

  mongo-ready:
    image: mongo:7.0
    container_name: "mongo-ready"
    depends_on:
      mongodb:
        condition: service_started
    networks: [cdp-tenant]
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
      RS_HOST: "localhost:27017"
    volumes:
      - ./compose/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'db.hello().isWritablePrimary' | grep -q true || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 60

  # Seeds the pre-minted dev token hash so grants-ui can authenticate with GAS
  # without needing to run scripts/mint-access-token.js manually.
  # Raw token (grants-ui: GAS_API_AUTH_TOKEN - see compose.override.yml): 42e3b7ce-740c-4b5e-b551-76d8fe219d80
  gas-seed-token:
    image: mongo:7.0
    container_name: gas-seed-token
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
    environment:
      TOKEN_HASH: 6d47cf58709a210c8282b8124617c22bf5c5c22022d931e3f922115fe2ab2768
    volumes:
      - ./compose/seed-gas-token.sh:/seed-gas-token.sh:ro
    entrypoint: ["/bin/bash", "/seed-gas-token.sh"]
    restart: "no"

  entra:
    container_name: entra
    image: defradigital/fg-entra-stub-frontend:0.13.0
    ports:
      - "3010:3010"
    networks:
      - cdp-tenant
    volumes:
      - ./compose/entra-clients.js:/home/node/src/server/common/clients.js:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3010/jwks"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - "6379:6379"
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    name: cdp-tenant
    driver: bridge
