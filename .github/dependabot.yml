version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into a shared PR to reduce noise
    groups:
      npm-dependencies:
        patterns:
          - "*"

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update Docker base images referenced in the compose files
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 10

    # Group packages into a shared PR to reduce noise
    groups:
      docker-images:
        patterns:
          - "*"

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: "10:30"
      timezone: "Europe/London"
