services:
  floci:
    env_file:
      - ../fg-grants-core/compose/aws.env
    volumes:
      - ../fg-grants-core/compose/floci/ready.d/10-core-resources.sh:/etc/floci/init/ready.d/10-core-resources.sh:ro
      - ../fg-grants-core/compose/floci/ready.d/99-ready.sh:/etc/floci/init/ready.d/99-ready.sh:ro
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    command: ["mongod", "--replSet", "mongoRepl", "--bind_ip_all"]

  mongo-ready:
    image: mongo:7.0
    volumes:
      - ./compose/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    networks:
      - cdp-tenant
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
      RS_HOST: "mongodb:27017"
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]

  # Move services onto cdp-tenant network so they can reach each other
  grants-ui:
    container_name: grants-ui
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    environment:
      CONFIG_API_URL: http://grants-config-broker:3012
      AGREEMENTS_UI_URL: http://host.docker.internal:3300
      AGREEMENTS_JWT_SECRET: a-string-secret-at-least-256-bits-long
      CONFIG_API_JWT_SECRET: forms-config-jwt-secret
      FORMS_API_SLUGS: ""
      GRANTS_UI_BACKEND_URL: http://grants-ui-backend:3001
      GRANTS_UI_BACKEND_AUTH_TOKEN: auth_token
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: encryption_key
      CV_API_MOCK_ENABLED: true
      CV_API_STUB_URL: http://grants-ui-dal-stub:3008/graphql
      GAS_API_URL: http://gas:3102
      GAS_API_AUTH_TOKEN: f081263c-6876-4d40-936f-ebdf63b5e893
      AWS_ENDPOINT_URL: http://floci:4566
      DEFRA_ID_CLIENT_ID: client_id
      DEFRA_ID_CLIENT_SECRET: client_secret
      DEFRA_ID_SERVICE_ID: service_id

  grants-ui-backend:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
    environment:
      GRANTS_UI_BACKEND_AUTH_TOKEN: auth_token
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: encryption_key
      AWS_ENDPOINT_URL: http://floci:4566
      CONFIG_INGEST_SQS_QUEUE_URL: http://floci:4566/000000000000/grants_ui_backend__sqs__config_updates

  fcp-defra-id-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    environment:
      AUTH_MODE: basic
      AUTH_OVERRIDE: ""
      AUTH_OVERRIDE_FILE: users.json

  grants-ui-dal-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  # Grants UI still declares its own LocalStack dependency for land grants.
  # Keep that emulator available without colliding with Floci on host port 4566.
  localstack:
    ports: !override
      - "4567:4566"
      - "4510-4559:4510-4559"

  mockserver:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    # Only relevant when gas (the real GAS backend, not mockserver-as-GAS) is
    # part of the stack: grants with %ENVIRONMENT%-templated action URLs
    # (i.e. pigs-might-fly's fg-gss-pmf calculator) have nothing to resolve
    # to locally. start-stack.js sets MOCKSERVER_INIT_PATH to add a second
    # expectations file on top of grants-ui's own when cw+grants-ui both run,
    # without touching grants-ui's compose/mockserver/expectations.json. 
    # This has to live here (not compose.gas.yml) since compose.override.yml is
    # guaranteed to merge last regardless of arg order, and grants-ui's own
    # compose.yml sets this same env var unconditionally.
    volumes:
      - ./compose/mockserver-gas-expectations.json:/config/gas-expectations.json
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: ${MOCKSERVER_INIT_PATH:-/config/expectations.json}

  gas:
    networks:
      - cdp-tenant
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      AWS_ENDPOINT_URL: http://floci:4566
      GAS__SNS__CREATE_PAYMENT_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:create_payment.fifo
      GAS__SNS__AGREEMENT_STATUS_UPDATED_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:agreement_status_updated_fifo.fifo
      GRANT_FUNDING_CALCULATOR_URL: http://fg-gss-pmf:3001
      VIEW_AGREEMENT_URI: http://host.docker.internal:3300
      GAS__SQS__CONFIG_VERSION_QUEUE_URL: http://floci:4566/000000000000/gas__sqs__config_version_updated
      CONFIG_BROKER_S3_BUCKET: configs-bucket
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3102/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fg-cw-backend:
    networks:
      - cdp-tenant
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      SERVICE_VERSION: "0.0.0"
      OIDC_JWKS_URI: http://entra:3010/jwks
      AWS_ENDPOINT_URL: http://floci:4566
      CREATE_NEW_CASE_SQS_URL: http://floci:4566/000000000000/create_new_case_fifo.fifo
      CW__SQS__CREATE_NEW_CASE_URL: http://floci:4566/000000000000/cw__sqs__create_new_case_fifo.fifo
      CW__SQS__UPDATE_STATUS_URL: http://floci:4566/000000000000/cw__sqs__update_status_fifo.fifo
      CW__SQS__CONFIG_VERSION_QUEUE_URL: http://floci:4566/000000000000/cw__sqs__config_version_updated
      CONFIG_BROKER_S3_BUCKET: configs-bucket

  fg-cw-frontend:
    environment:
      NODE_ENV: development
      LOG_FORMAT: ecs
      AGREEMENTS_UI_URL: http://host.docker.internal:3300
      AGREEMENTS_UI_TOKEN: your-agreements-ui-token
      AGREEMENTS_BASE_URL: /agreement
      AGREEMENTS_JWT_SECRET: a-string-secret-at-least-256-bits-long
      AGREEMENTS_PROXY_TIMEOUT_MS: 30000

  fg-grants-platform-admin:
    networks:
      - cdp-tenant
    environment:
      REDIS_HOST: redis
      OIDC_DISCOVERY_URI: http://entra:3010/.well-known/openid-configuration
      OIDC_CLIENT_ID: fg-grants-platform-admin

  # Seeds the pre-minted dev token hash so grants-ui can authenticate with GAS
  # without needing to run scripts/mint-access-token.js manually.
  # Raw token (grants-ui: GAS_API_AUTH_TOKEN - see compose.override.yml): f081263c-6876-4d40-936f-ebdf63b5e893
  gas-seed-token:
    image: mongo:7.0
    container_name: gas-seed-token
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gas:
        condition: service_healthy
    environment:
      TOKEN_HASH: 54cc2d5522a2d00a483f4b394a9e931fcf0dd48b97f8c43e780db071d3922c01
    volumes:
      - ./compose/seed-gas-token.sh:/seed-gas-token.sh:ro
    entrypoint: ["/bin/bash", "/seed-gas-token.sh"]
    restart: "no"

  farming-grants-agreements-api:
    build:
      context: ../farming-grants-agreements-api/
    env_file:
      - compose/aws.env
    profiles:
      - agreements
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      SQS_ENDPOINT: http://floci:4566
      QUEUE_URL: http://floci:4566/000000000000/create_agreement_fifo.fifo
      SQS_GAS_APPLICATION_STATUS_UPDATED_QUEUE_URL: http://floci:4566/000000000000/update_agreement_fifo.fifo
      S3_ENDPOINT: http://floci:4566
      SNS_ENDPOINT: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      MONGO_URI: mongodb://mongodb:27017/
      VIEW_AGREEMENT_URI: http://host.docker.internal:3300
      TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:grant_application_approved_fifo.fifo
      LAND_GRANTS_BASE_URL: http://host.docker.internal:3009
      SEED_DB: false
    networks:
      - cdp-tenant

  farming-grants-agreements-ui:
    profiles:
      - agreements
    networks:
      - cdp-tenant
    environment:
      AGREEMENTS_JWT_SECRET: a-string-secret-at-least-256-bits-long
      GAS_BACKEND_URL: http://gas:3102
      GAS_API_AUTH_TOKEN: f081263c-6876-4d40-936f-ebdf63b5e893

  grants-config-broker:
    profiles:
      - config-broker
    networks:
      - cdp-tenant
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-ready:
        condition: service_healthy
      floci:
        condition: service_healthy
    environment:
      PORT: 3012
      AWS_ACCESS_KEY_ID: test
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_SECRET_ACCESS_KEY: test
      CONFIG_INPUT_QUEUE_URL: http://floci:4566/000000000000/gfr__sqs___config_input
      MONGO_URI: mongodb://mongodb:27017/
    volumes:
      - ${CONFIG_BROKER_PACKAGES_DIR:-../grants-config-broker/compose}:/home/node/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3012/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  mongodb-data:
  mongodb-config:
