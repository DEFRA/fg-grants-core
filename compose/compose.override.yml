services:
  localstack:
    env_file:
      - ../fg-grants-core/compose/aws.env
    volumes:
      - ../fg-grants-core/tmp/localstack:/var/lib/localstack
      - ../fg-grants-core/compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    command: ["mongod", "--replSet", "mongoRepl", "--bind_ip_all"]

  mongo-ready:
    image: mongo:7.0
    volumes:
      - ./compose/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    networks:
      - cdp-tenant
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
      RS_HOST: "mongodb:27017"
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]

  gas-token-setup:
    image: mongo:7.0
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    volumes:
      - ./compose/gas-token-setup.sh:/gas-token-setup.sh:ro
    environment:
      GAS_TOKEN_HASH: 7fe695dbd6905047b6b5c447211f705c54691915b28bf43f80035624192185f1
    depends_on:
      mongo-ready:
        condition: service_healthy
    command: sh /gas-token-setup.sh
    restart: "no"

  # Move services onto cdp-tenant network so they can reach each other
  grants-ui:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    depends_on:
      gas-token-setup:
        condition: service_completed_successfully
    environment:
      GAS_API_URL: http://gas:3102
      GAS_API_AUTH_TOKEN: f6214ad7-4e4b-4e5b-baa3-e0f0eae97fe9
      #<generate a token npm generate:gas-token> 

  grants-ui-backend:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  grants-ui-config-api:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  fcp-defra-id-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  grants-ui-dal-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  mockserver:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  gas:
    networks:
      - cdp-tenant

  fg-cw-frontend:
    environment:
      NODE_ENV: development
      LOG_FORMAT: ecs

volumes:
  redis-data:
  mongodb-data:
  mongodb-config: