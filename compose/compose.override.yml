services:
  floci:
    # grants-ui's compose.infra.yml defines floci with an unpinned image; this
    # file merges last, so it keeps the stack on core's pinned version.
    image: floci/floci:1.5.33-compat
    env_file:
      - ../fg-grants-core/compose/aws.env
    # Repeated from compose.yml so grants-ui's floci definition can't drop it.
    environment:
      FLOCI_STORAGE_SERVICES_S3_MODE: persistent
    volumes:
      - floci-data:/app/data
      - ../fg-grants-core/compose/floci/ready.d/10-core-resources.sh:/etc/floci/init/ready.d/10-core-resources.sh:ro
      - ../fg-grants-core/compose/floci/ready.d/99-ready.sh:/etc/floci/init/ready.d/99-ready.sh:ro
    # grants-ui's compose file sets a healthcheck on /tmp/READY, which its own
    # scripts write before core's resources exist (see ready.d/99-ready.sh).
    healthcheck:
      test: ["CMD", "stat", "/tmp/FG_GRANTS_CORE_READY"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    command: ["mongod", "--replSet", "mongoRepl", "--bind_ip_all"]

  mongo-ready:
    image: mongo:7.0
    volumes:
      - ./compose/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    networks:
      - cdp-tenant
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
      RS_HOST: "mongodb:27017"
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]

  # Move services onto cdp-tenant network so they can reach each other
  grants-ui:
    container_name: grants-ui
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    environment:
      CONFIG_API_URL: http://grants-config-broker:3012
      AGREEMENTS_UI_URL: http://host.docker.internal:3300
      AGREEMENTS_JWT_SECRET: a-string-secret-at-least-256-bits-long
      CONFIG_API_JWT_SECRET: forms-config-jwt-secret
      FORMS_API_SLUGS: ""
      GRANTS_UI_BACKEND_URL: http://grants-ui-backend:3001
      GRANTS_UI_BACKEND_AUTH_TOKEN: auth_token
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: encryption_key
      CV_API_MOCK_ENABLED: true
      CV_API_STUB_URL: http://grants-ui-dal-stub:3008/graphql
      GAS_API_URL: http://gas:3102
      GAS_API_AUTH_TOKEN: f081263c-6876-4d40-936f-ebdf63b5e893

  grants-ui-backend:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
    environment:
      GRANTS_UI_BACKEND_AUTH_TOKEN: auth_token
      GRANTS_UI_BACKEND_ENCRYPTION_KEY: encryption_key

  fcp-defra-id-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    environment:
      AUTH_MODE: basic
      AUTH_OVERRIDE: ""
      AUTH_OVERRIDE_FILE: users.json

  grants-ui-dal-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  mockserver:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    # Only relevant when gas (the real GAS backend, not mockserver-as-GAS) is
    # part of the stack: grants with %ENVIRONMENT%-templated action URLs
    # (i.e. pigs-might-fly's fg-gss-pmf calculator) have nothing to resolve
    # to locally. start-stack.js sets MOCKSERVER_INIT_PATH to add a second
    # expectations file on top of grants-ui's own when cw+grants-ui both run,
    # without touching grants-ui's compose/mockserver/expectations.json.
    # This has to live here (not compose.gas.yml) since compose.override.yml is
    # guaranteed to merge last regardless of arg order, and grants-ui's own
    # compose.yml sets this same env var unconditionally.
    volumes:
      - ./compose/mockserver-gas-expectations.json:/config/gas-expectations.json
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: ${MOCKSERVER_INIT_PATH:-/config/expectations.json}

  gas:
    networks:
      - cdp-tenant
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      AWS_ENDPOINT_URL: http://floci:4566
      GRANT_FUNDING_CALCULATOR_URL: http://fg-gss-pmf:3001
      GAS__SQS__CONFIG_VERSION_QUEUE_URL: http://floci:4566/000000000000/gas__sqs__config_version_updated
      CONFIG_BROKER_S3_BUCKET: configs-bucket
      CONFIGURATION_VARIANT: ${CONFIGURATION_VARIANT:-}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CW_BACKEND_URL: http://fg-cw-backend:3101
      # The raw local token for GAS to call fg-cw-backend; fg-cw-backend seeds
      # its hash from SERVICE_ACCESS_TOKEN_HASH below.
      CW_BACKEND_TOKEN: 9c05f401-94eb-4e95-8b98-111a2048f4c2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3102/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fg-cw-backend:
    networks:
      - cdp-tenant
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      OIDC_JWKS_URI: http://entra:3010/jwks
      AWS_ENDPOINT_URL: http://floci:4566
      CREATE_NEW_CASE_SQS_URL: http://floci:4566/000000000000/create_new_case_fifo.fifo
      CW__SQS__CREATE_NEW_CASE_URL: http://floci:4566/000000000000/cw__sqs__create_new_case_fifo.fifo
      CW__SQS__UPDATE_STATUS_URL: http://floci:4566/000000000000/cw__sqs__update_status_fifo.fifo
      CW__SQS__CONFIG_VERSION_QUEUE_URL: http://floci:4566/000000000000/cw__sqs__config_version_updated
      CONFIG_BROKER_S3_BUCKET: configs-bucket
      CONFIGURATION_VARIANT: ${CONFIGURATION_VARIANT:-}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # Seeded on boot so GAS can call the CW roles endpoint.
      # Raw token (gas: CW_BACKEND_TOKEN): 9c05f401-94eb-4e95-8b98-111a2048f4c2
      SERVICE_ACCESS_TOKEN_HASH: fg-gas-backend:919da0b26f9260ad69fd6a57a71df612d4fb556ccb8628c7a8e18f7e0e718572

  fg-cw-frontend:
    environment:
      NODE_ENV: development
      LOG_FORMAT: ecs
      AGREEMENTS_UI_URL: http://host.docker.internal:3300
      AGREEMENTS_UI_TOKEN: your-agreements-ui-token
      AGREEMENTS_BASE_URL: /agreement
      AGREEMENTS_JWT_SECRET: a-string-secret-at-least-256-bits-long
      AGREEMENTS_PROXY_TIMEOUT_MS: 30000

  # Seeds a dev token into fg-gas-backend so fg-grants-platform-admin can call
  # the grant-admin routes (which require client = 'fg-grants-platform-admin').
  # Raw token (platform-admin: GAS_SERVICE_TOKEN): gpa-gas-test-token-001
  gas-seed-gpa-token:
    image: mongo:7.0
    container_name: gas-seed-gpa-token
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gas:
        condition: service_healthy
    environment:
      TOKEN_HASH: c26319bc3d61c048de4d1719999665dcafa326341ed1c6e0611a1a90389492f0
    volumes:
      - ./compose/seed-gas-gpa-token.sh:/seed-gas-gpa-token.sh:ro
    entrypoint: ["/bin/bash", "/seed-gas-gpa-token.sh"]
    restart: "no"

  # Seeds the pre-minted dev token hash so grants-ui can authenticate with GAS
  # without needing to run scripts/mint-access-token.js manually.
  # Raw token (grants-ui: GAS_API_AUTH_TOKEN - see compose.override.yml): f081263c-6876-4d40-936f-ebdf63b5e893
  gas-seed-token:
    image: mongo:7.0
    container_name: gas-seed-token
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gas:
        condition: service_healthy
    environment:
      TOKEN_HASH: 54cc2d5522a2d00a483f4b394a9e931fcf0dd48b97f8c43e780db071d3922c01
    volumes:
      - ./compose/seed-gas-token.sh:/seed-gas-token.sh:ro
    entrypoint: ["/bin/bash", "/seed-gas-token.sh"]
    restart: "no"

  farming-grants-agreements-api:
    build:
      context: ../farming-grants-agreements-api/
    env_file:
      - compose/aws.env
    profiles:
      - agreements
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      SQS_ENDPOINT: http://floci:4566
      QUEUE_URL: http://floci:4566/000000000000/create_agreement_fifo.fifo
      SQS_GAS_APPLICATION_STATUS_UPDATED_QUEUE_URL: http://floci:4566/000000000000/update_agreement_fifo.fifo
      S3_ENDPOINT: http://floci:4566
      SNS_ENDPOINT: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      MONGO_URI: mongodb://mongodb:27017/
      TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:grant_application_approved_fifo.fifo
      LAND_GRANTS_BASE_URL: http://host.docker.internal:3009
      SEED_DB: false
    networks:
      - cdp-tenant

  farming-grants-agreements-ui:
    profiles:
      - agreements
    networks:
      - cdp-tenant

  # Runs in every stack: it publishes the grant configs that GAS, CW and
  # grants-ui-backend read, built by start-stack.js from the local
  # grants-config-* repos. grants-ui's compose file also defines this service
  # (unpinned, always pulled, with its own config folder); this file merges
  # last, so the settings below win. The config-broker option swaps the image
  # for a local build (compose.config-broker.yml).
  grants-config-broker:
    image: defradigital/grants-config-broker:0.48.2
    pull_policy: missing
    ports:
      - "3012:3012"
    volumes:
      - ${CONFIG_BROKER_PACKAGES_DIR:-./compose/config-broker-local}:/home/node/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3012/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cdp-tenant
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-ready:
        condition: service_healthy
      floci:
        condition: service_healthy
    environment:
      PORT: 3012
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DATABASE: grants-config-broker
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      GFR__SNS__CONFIG_UPDATE_TOPIC_ARN: arn:aws:sns:eu-west-2:000000000000:gfr__sns___config_update
      CONFIG_BUCKET_NAME: configs-bucket
      CONFIG_INPUT_QUEUE_URL: http://floci:4566/000000000000/gfr__sqs___config_input
      SERVICE_AUTH_ENABLED: false
      AUDIT_ENABLED: false

  redis:
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  mongodb-data:
  mongodb-config:
