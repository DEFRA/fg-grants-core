services:
  localstack:
    env_file:
      - ../fg-grants-core/compose/aws.env
    volumes:
      - ../fg-grants-core/tmp/localstack:/var/lib/localstack
      - ../fg-grants-core/compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    command: ["mongod", "--replSet", "mongoRepl", "--bind_ip_all"]

  mongo-ready:
    image: mongo:7.0
    volumes:
      - ./compose/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    networks:
      - cdp-tenant
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
      RS_HOST: "mongodb:27017"
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]

  # Move services onto cdp-tenant network so they can reach each other
  grants-ui:
    container_name: grants-ui
    profiles:
      - grants-ui
    networks:
      - cdp-tenant
    environment:
      GAS_API_URL: http://gas:3102
      # to mint a token see https://github.com/DEFRA/fg-gas-backend#minting-service-access-tokens
      GAS_API_AUTH_TOKEN: 42e3b7ce-740c-4b5e-b551-76d8fe219d80

  grants-ui-backend:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  grants-ui-config-api:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  fcp-defra-id-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  grants-ui-dal-stub:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  mockserver:
    profiles:
      - grants-ui
    networks:
      - cdp-tenant

  # Seeds the pre-minted dev token hash so grants-ui can authenticate with GAS
  # without developers needing to run scripts/mint-access-token.js manually.
  # Raw token (GAS_API_AUTH_TOKEN above): 42e3b7ce-740c-4b5e-b551-76d8fe219d80
  gas-seed-token:
    image: mongo:7.0
    container_name: gas-seed-token
    networks:
      - cdp-tenant
    depends_on:
      mongo-ready:
        condition: service_healthy
    environment:
      TOKEN_HASH: 6d47cf58709a210c8282b8124617c22bf5c5c22022d931e3f922115fe2ab2768
    volumes:
      - ./compose/seed-gas-token.sh:/seed-gas-token.sh:ro
    entrypoint: ["/bin/bash", "/seed-gas-token.sh"]
    restart: "no"

  gas:
    networks:
      - cdp-tenant
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      AWS_ENDPOINT_URL: http://localstack:4566

  fg-cw-backend:
    networks:
      - cdp-tenant
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      OIDC_JWKS_URI: http://entra:3010/jwks
      AWS_ENDPOINT_URL: http://localstack:4566

  fg-cw-frontend:
    environment:
      NODE_ENV: development
      LOG_FORMAT: ecs

volumes:
  redis-data:
  mongodb-data:
  mongodb-config: