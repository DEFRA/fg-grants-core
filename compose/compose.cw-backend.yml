include:
  - path: ../fg-cw-backend/compose/compose.cw-backend.yml
    project_directory: ../fg-cw-backend

services:
  floci:
    volumes:
      # fg-cw-backend creates its own queues and topics. Mounted as a single
      # file into ready.d, so it runs after core's 10-core-resources.sh and
      # before 99-ready.sh writes the marker the floci healthcheck waits on.
      - ../fg-cw-backend/compose/floci/start.d/10-setup-resources.sh:/etc/floci/init/ready.d/21-cw-resources.sh:ro
